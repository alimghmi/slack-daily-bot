[project]
name = "otanami-slack-daily"
version = "0.1.0"
description = "Self-hosted Slack daily standup bot for the Otanami workspace."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10.4",
    "pyyaml>=6.0.2",
    "slack-bolt>=1.21.0",
    "slack-sdk>=3.31.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

